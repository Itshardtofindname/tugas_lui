<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15)), 
                        url('Gambar/background menu.png') no-repeat center center/cover;
            overflow: hidden;
        }

        .menu-wrapper {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin-top: -20px;
        }

       
        .header-title-btn {
            width: 100%;
            background-color: #F9D06E;
            color: #000000;
            font-weight: 900;
            font-size: 24px;
            text-align: center;
            text-decoration: none;
            padding: 20px 10px;
            border-radius: 10px;
            border: 3px solid #000000;
            box-shadow: 0px 6px 8px rgba(0, 0, 0, 0.35);
            display: block;
            margin-bottom: 25px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .header-title-btn:hover {
            transform: scale(1.03);
        }

        
        .menu-list {
            width: 88%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        
        .btn-figma {
            background-color: #F9D06E;
            color: #000000;
            font-weight: bold;
            font-size: 17px;
            text-align: center;
            text-decoration: none;
            padding: 15px 10px;
            border-radius: 10px;
            display: block;
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0px 3px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s ease;
        }

        .btn-figma:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="menu-wrapper">
        <a href="home.html" target="konten" class="header-title-btn">Menu Utama</a>

        <div class="menu-list">
            <a href="tari daerah.html" target="konten" class="btn-figma">Tari Daerah</a>
            <a href="KULINER.html" target="konten" class="btn-figma">Makanan Daerah</a>
            <a href="rumah_adat.html" target="konten" class="btn-figma">Rumah Adat</a>
            <a href="senjata daerah.html" target="konten" class="btn-figma">Senjata Tradisional</a>
        </div>
    </div>

</body>
</html>
